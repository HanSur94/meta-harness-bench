name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # tsc only: upstream does not conform to its own biome config (70 errors);
      # biome stays a local tool (`bun run lint`) until touched files are formatted.
      - run: bunx tsc --noEmit
      - run: bun test
